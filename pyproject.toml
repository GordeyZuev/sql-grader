[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-course-cabinet"
version = "0.2.0"
description = "Standalone SQL homework cabinet prototype"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<0.120", "uvicorn[standard]>=0.30,<1", "psycopg[binary]>=3.2,<4", "python-multipart>=0.0.9,<1", "python-dotenv>=1,<2", "sqlparse>=0.5,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<0.28", "ruff>=0.6,<1"]

[tool.setuptools.package-data]
cabinet = ["static/*"]

[tool.setuptools.packages.find]
include = ["cabinet*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
