services:
  cabinet:
    build: .
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    env_file: .env
    environment:
      CABINET_DB_PATH: /data/cabinet.sqlite3
      CABINET_MANIFEST: /data/manifest.json
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - cabinet-data:/data

  backup:
    build: .
    restart: unless-stopped
    network_mode: none
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      CABINET_DB_PATH: /data/cabinet.sqlite3
      CABINET_BACKUP_DIR: /backups
    command: ["python", "-m", "cabinet.backup", "--loop"]
    volumes:
      - cabinet-data:/data
      - cabinet-backups:/backups

volumes:
  cabinet-data:
  cabinet-backups:
